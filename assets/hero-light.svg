<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-label="LYH · 机器人控制与规划 · 从任务规划到执行器实时层">
<style>.nm{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:70px;font-weight:600;letter-spacing:-2.2px;fill:#17181a}.role{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:23px;font-weight:500;fill:#17181a}.tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:18px;font-weight:400;fill:#5f646b}.mv{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:32px;font-weight:600;fill:#17181a}.mu{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:17px;font-weight:500;fill:#8d939a}.ml{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:16px;font-weight:400;fill:#8d939a}.ln{stroke:#e4e4e0;stroke-width:1.2}.dot{fill:#0f766e}</style>
