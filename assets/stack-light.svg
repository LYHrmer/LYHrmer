<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-label="控制栈 5 层：轨迹生成与优化、反馈控制、状态估计与辨识、执行器与实时层、感知导航与仿真">
<style>.ln{stroke:#e4e4e0;stroke-width:1.2}.idx{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-size:13px;font-weight:600;fill:#0f766e}.nm{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:25px;font-weight:600;fill:#17181a}.mt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:17px;font-weight:400;fill:#5f646b}.mv{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:26px;font-weight:600;fill:#17181a}.ml{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:14px;font-weight:400;fill:#8d939a}</style>
<text class="idx" x="40" y="74" fill-opacity="0.38">01</text>
<text class="nm" x="84" y="76">轨迹生成与优化</text>
<text class="mt" x="84" y="110">约束 MPC · DLS 解析逆运动学 · 残差策略 PPO · ONNX 实时推理</text>
<text class="mv" x="1080" y="76" text-anchor="end">0.0333 m/s</text>
<text class="ml" x="1080" y="110" text-anchor="end">留出道路速度误差</text>
<line class="ln" x1="40" y1="142" x2="1080" y2="142"/>
<text class="idx" x="40" y="186" fill-opacity="0.54">02</text>
<text class="nm" x="84" y="188">反馈控制</text>
<text class="mt" x="84" y="222">LQR · 滑模 SMC · ESO 扰动观测 · 阻抗 / 导纳 / 力位混合 · VMC</text>
<text class="mv" x="1080" y="188" text-anchor="end">−72.5%</text>
<text class="ml" x="1080" y="222" text-anchor="end">DM4310 Pitch 误差</text>
<line class="ln" x1="40" y1="254" x2="1080" y2="254"/>
<text class="idx" x="40" y="298" fill-opacity="0.69">03</text>
<text class="nm" x="84" y="300">状态估计与辨识</text>
<text class="mt" x="84" y="334">递推最小二乘 · 编码器与摩擦辨识 · PnP 位姿 · IMU 融合</text>
<text class="mv" x="1080" y="300" text-anchor="end">6.03 mm</text>
<text class="ml" x="1080" y="334" text-anchor="end">PnP 位置误差</text>
<line class="ln" x1="40" y1="366" x2="1080" y2="366"/>
<text class="idx" x="40" y="410" fill-opacity="0.84">04</text>
<text class="nm" x="84" y="412">执行器与实时层</text>
<text class="mt" x="84" y="446">GM6020 电流模式 · DM4310 力矩 · 500 Hz 物理步进 · FreeRTOS</text>
<text class="mv" x="1080" y="412" text-anchor="end">2 ms</text>
<text class="ml" x="1080" y="446" text-anchor="end">实车控制周期</text>
<line class="ln" x1="40" y1="478" x2="1080" y2="478"/>
<text class="idx" x="40" y="522" fill-opacity="1.00">05</text>
<text class="nm" x="84" y="524">感知、导航与仿真</text>
<text class="mt" x="84" y="558">RGB-D 闭环导航 · 点云聚类抓取 · 连续越障</text>
<text class="mv" x="1080" y="524" text-anchor="end">286 m</text>
<text class="ml" x="1080" y="558" text-anchor="end">四足带臂连续越障</text>
</svg>
